name: deliveria
description: Deliveria customer application
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_maps_flutter: ^2.12.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  firebase_analytics: ^12.0.3
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/delivery/
    - assets/illustrations/empty_states/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
